<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalyst.BD | প্রিমিয়াম ডিভাইস ও অ্যারোমা কালেকশন</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brown:#4A2C17;--gold:#C8922A;--cream:#FAF6F0;--dark:#1A1008;
      --muted:#7A6555;--white:#fff;--green:#25D366;--light:#F2EBE1;
    }
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--dark);line-height:1.6;overflow-x:hidden}

    /* NAV */
    nav{position:sticky;top:0;z-index:200;background:var(--brown);display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:64px;box-shadow:0 2px 16px rgba(0,0,0,.35)}
    .nav-logo{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.5rem;letter-spacing:.04em;text-decoration:none;display:flex;align-items:center}
    .nav-links{display:flex;gap:20px;align-items:center}
    .nav-links a{color:#D4C4B5;font-size:.85rem;text-decoration:none;transition:color .2s}
    .nav-links a:hover{color:var(--gold)}
    .nav-cta{background:var(--gold)!important;color:var(--white)!important;padding:8px 18px;border-radius:4px;font-weight:600}
    .nav-cta:hover{opacity:.85}

    /* HERO */
    .hero{background:linear-gradient(135deg,var(--brown) 0%,#2E1A0E 100%);color:var(--white);padding:90px 5% 80px;text-align:center;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;top:-40%;left:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(200,146,42,.12) 0%,transparent 70%);animation:pulse 6s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
    .hero-eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;animation:fadeUp .8s ease both}
    .hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3.6rem);line-height:1.2;margin-bottom:20px;animation:fadeUp .9s .1s ease both}
    .hero h1 span{color:var(--gold)}
    .hero p{font-size:1rem;color:#D4C4B5;max-width:520px;margin:0 auto 32px;animation:fadeUp 1s .2s ease both}
    .hero-badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:36px;animation:fadeUp 1s .3s ease both}
    .badge{background:rgba(200,146,42,.15);border:1px solid var(--gold);color:var(--gold);font-size:.78rem;padding:6px 14px;border-radius:20px;font-weight:500}
    .hero-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;animation:fadeUp 1s .4s ease both}
    .btn-primary{display:inline-block;background:var(--gold);color:var(--white);font-weight:700;font-size:1rem;padding:14px 32px;border-radius:5px;text-decoration:none;transition:transform .2s,opacity .2s}
    .btn-primary:hover{transform:translateY(-2px);opacity:.9}
    .btn-wa{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--white);font-weight:700;font-size:1rem;padding:14px 28px;border-radius:5px;text-decoration:none;transition:transform .2s,opacity .2s}
    .btn-wa:hover{transform:translateY(-2px);opacity:.9}
    .btn-wa svg{width:20px;height:20px;fill:white;flex-shrink:0}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

    /* CATEGORY TABS */
    .catalogue{padding:70px 5%}
    .section-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2.2rem);color:var(--brown);text-align:center;margin-bottom:8px}
    .divider{width:48px;height:3px;background:var(--gold);margin:12px auto 16px;border-radius:2px}
    .section-sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:36px}
    .tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:40px}
    .tab{padding:10px 24px;border:2px solid var(--brown);border-radius:30px;font-weight:600;font-size:.88rem;cursor:pointer;background:transparent;color:var(--brown);transition:all .25s}
    .tab.active,.tab:hover{background:var(--brown);color:var(--white)}

    /* PRODUCT GRID */
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;max-width:1100px;margin:0 auto}
    .product-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(74,44,23,.1);transition:transform .3s,box-shadow .3s;opacity:0;animation:cardIn .5s ease forwards;cursor:pointer}
    .product-card:hover{transform:translateY(-6px);box-shadow:0 14px 36px rgba(74,44,23,.18)}
    @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .card-img-wrap{position:relative;overflow:hidden;height:240px;background:#f5f0eb}
    .card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
    .product-card:hover .card-img-wrap img{transform:scale(1.07)}
    .card-badge{position:absolute;top:12px;left:12px;background:var(--gold);color:var(--white);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.05em}
    .card-body{padding:18px 16px 16px}
    .card-body h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--brown);margin-bottom:6px}
    .card-desc{font-size:.82rem;color:var(--muted);margin-bottom:10px;line-height:1.55}
    .card-colors{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
    .color-dot{width:18px;height:18px;border-radius:50%;border:2px solid #ddd;cursor:pointer;transition:transform .2s}
    .color-dot:hover{transform:scale(1.25)}
    .card-price{font-size:1.25rem;font-weight:700;color:var(--gold);margin-bottom:14px}
    .card-price span{font-size:.8rem;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:6px}
    .card-btn{display:block;width:100
